<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <title>Hallucination Hunter</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="hh-header">
    <a class="hh-brand" id="hh-brand-link" href="https://hallucination-hunter-five.vercel.app" target="_blank" rel="noopener" title="Open Hallucination Hunter web app">
      <svg class="hh-brand-mark" width="22" height="22" viewBox="0 0 32 32" aria-hidden="true">
        <rect class="hh-logo-bg" width="32" height="32" rx="6" fill="#171614"/>
        <path d="M8.5 10.5h15" stroke="#f7f6f2" stroke-width="2.1" stroke-linecap="round"/>
        <path d="M8.5 16h6.5" stroke="#f7f6f2" stroke-width="2.1" stroke-linecap="round"/>
        <path d="M18.2 16h5.3" stroke="#d94e28" stroke-width="2.2" stroke-linecap="round"/>
        <path d="M8.5 21.5h10.5" stroke="#f7f6f2" stroke-width="2.1" stroke-linecap="round"/>
      </svg>
      <span class="hh-title">Hallucination Hunter</span>
    </a>
    <div class="hh-header-right">
      <span class="hh-version" id="hh-version">v1.2</span>
      <button type="button" class="hh-icon-btn" id="hh-theme-btn" title="Switch theme" aria-label="Switch theme">
        <svg class="hh-i-moon" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M15.4 12.2A6.3 6.3 0 0 1 7.8 4.6a6.3 6.3 0 1 0 7.6 7.6Z"/>
        </svg>
        <svg class="hh-i-sun" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true">
          <circle cx="10" cy="10" r="3.2"/>
          <path d="M10 2.4v1.8M10 15.8v1.8M2.4 10h1.8M15.8 10h1.8M4.6 4.6l1.3 1.3M14.1 14.1l1.3 1.3M4.6 15.4l1.3-1.3M14.1 5.9l1.3-1.3"/>
        </svg>
      </button>
    </div>
  </header>

  <main class="hh-main" id="hh-main">
    <div class="hh-collapsed-bar" id="hh-collapsed-bar" hidden>
      <span class="hh-collapsed-snippet" id="hh-collapsed-snippet"></span>
      <div class="hh-collapsed-actions">
        <button type="button" class="hh-chip-btn" id="hh-edit-btn">Edit</button>
        <button type="button" class="hh-chip-btn" id="hh-new-btn">New</button>
      </div>
    </div>

    <div class="hh-input-area" id="hh-input-area">
      <div class="hh-label-row">
        <label class="hh-label" for="hh-text-input">Text to check</label>
        <div class="hh-label-tools">
          <button type="button" class="hh-paste-btn" id="hh-paste-btn" title="Paste from clipboard">Paste</button>
          <span class="hh-count" id="hh-count">0 / 20,000</span>
        </div>
      </div>

      <div class="hh-sheet">
        <textarea id="hh-text-input" placeholder="Paste an AI answer, or highlight text on any page before opening." rows="5" spellcheck="false" maxlength="20000"></textarea>
      </div>

      <div id="hh-auto-detect" class="hh-auto-detect" hidden></div>

      <div class="hh-input-actions">
        <span class="hh-hint"><kbd id="hh-mod-key">Ctrl</kbd> <kbd>&crarr;</kbd></span>
        <button id="hh-clear-btn" class="hh-btn-secondary" type="button">Clear</button>
        <button id="hh-analyze-btn" class="hh-btn-primary" type="button">
          <span class="hh-btn-label">Check claims</span>
          <span class="hh-btn-spin" aria-hidden="true"></span>
        </button>
      </div>
    </div>

    <div id="hh-loading" class="hh-loading" hidden>
      <div class="hh-progress"><span></span></div>
      <div class="hh-loading-row">
        <span id="hh-loading-text">Extracting factual claims&hellip;</span>
        <button id="hh-cancel-btn" class="hh-link-btn" type="button">Cancel</button>
      </div>
    </div>

    <div id="hh-error" class="hh-error" role="alert" hidden>
      <span id="hh-error-text"></span>
      <button id="hh-retry-btn" class="hh-link-btn" type="button" hidden>Retry</button>
    </div>

    <section id="hh-results" class="hh-results" hidden aria-live="polite">
      <div class="hh-score-card">
        <div class="hh-score-row">
          <div class="hh-score-copy">
            <span class="hh-verdict-title" id="hh-verdict-title">Mostly accurate</span>
            <span class="hh-verdict-sub" id="hh-verdict-sub">0 of 0 claims verified</span>
          </div>
          <div id="hh-trust-value" class="hh-trust-value">0%</div>
        </div>
        <div class="hh-trust-track" aria-hidden="true">
          <span id="hh-bd-verified" class="hh-bd hh-bd-v" style="width:0%"></span>
          <span id="hh-bd-unverifiable" class="hh-bd hh-bd-u" style="width:0%"></span>
          <span id="hh-bd-false" class="hh-bd hh-bd-f" style="width:0%"></span>
        </div>
      </div>

      <div class="hh-filter-bar" role="group" aria-label="Filter claims">
        <button type="button" class="hh-ftab active" data-filter="all" aria-pressed="true">All <span id="hh-count-all">0</span></button>
        <button type="button" class="hh-ftab" data-filter="verified" aria-pressed="false"><i class="hh-dot hh-dot-v"></i><span id="hh-count-verified">0</span></button>
        <button type="button" class="hh-ftab" data-filter="unverifiable" aria-pressed="false"><i class="hh-dot hh-dot-u"></i><span id="hh-count-unverifiable">0</span></button>
        <button type="button" class="hh-ftab" data-filter="false" aria-pressed="false"><i class="hh-dot hh-dot-f"></i><span id="hh-count-incorrect">0</span></button>
      </div>

      <div id="hh-claims-list" class="hh-claims-list"></div>

      <div class="hh-result-actions">
        <button id="hh-copy-btn" class="hh-btn-outline" type="button">Copy report</button>
        <button id="hh-open-btn" class="hh-btn-outline" type="button">Open full view &nearr;</button>
      </div>
    </section>
  </main>

  <footer class="hh-footer">
    <a href="https://hallucination-hunter-five.vercel.app" target="_blank" rel="noopener">hallucination-hunter-five.vercel.app</a>
    <kbd id="hh-shortcut-hint">Alt+Shift+H</kbd>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
